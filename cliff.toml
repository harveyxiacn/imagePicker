# git-cliff configuration (https://git-cliff.org). Conventional Commits -> CHANGELOG.md
# Regenerate everything:   git cliff --output CHANGELOG.md
# At release time:         git cliff --tag vX.Y.Z --output CHANGELOG.md
# Release notes only:      git cliff --unreleased --tag vX.Y.Z --strip header
#                          (or `git cliff --latest --strip header` once the tag exists)

[changelog]
header = """
# Changelog

All notable changes to imagePicker are documented here. The project follows
[Semantic Versioning](https://semver.org/). This file is generated from
Conventional Commits by git-cliff (`cliff.toml`); do not edit by hand.

"""
body = """
{%- macro remote_url() -%}
  https://github.com/harveyxiacn/imagePicker
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif -%}
  {% if commit.breaking %}**BREAKING** {% endif -%}
  {{ commit.message | split(pat="\n") | first | upper_first | trim }} \
  ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9]*"
commit_preprocessors = [
  # Strip trailing PR numbers "(#12)" from squash merges.
  { pattern = '\s*\(#[0-9]+\)\s*$', replace = "" },
]
commit_parsers = [
  # Noise: merge commits, WIP snapshots, release housekeeping.
  { message = "^Merge ", skip = true },
  { message = "^merge", skip = true },
  { message = "^wip", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore: release", skip = true },
  { body = ".*BREAKING CHANGE.*", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactor" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^(ci|build)", group = "<!-- 7 -->CI and build" },
  { message = "^(chore|style)", group = "<!-- 8 -->Miscellaneous" },
]
