name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude ip-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude ip-desktop

  # The Rust core must keep cross-compiling for Android (docs/android-build.md). The ubuntu
  # runner image ships the Android SDK + NDK (ANDROID_NDK_HOME); scripts/android-env.sh wires up
  # the per-target clang / ar.
  android:
    name: Android check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: bash scripts/cargo-android.sh check -p ip-server -p ip-cli --target ${{ matrix.target }}

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  ai-worker:
    name: AI worker (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra cpu --dev
      - run: uv run ruff check .
      - run: uv run pytest -m "not models and not gpu"

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libxdo-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install
        working-directory: apps/desktop
      # Tauri's externalBin needs the pinned uv (M7 AI runtime installer); sha256-verified, git-ignored.
      - run: bash apps/desktop/scripts/fetch-uv.sh
      # Compile-only (no installer, no release publishing); builds the SPA via beforeBuildCommand.
      - run: pnpm tauri build --no-bundle
        working-directory: apps/desktop

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cargo workspace, Cargo.lock, tauri.conf.json, both package.json files and pyproject.toml must agree.
      - run: bash scripts/bump-version.sh --check

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK 27
        run: |
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Core cross-compile check
        run: cargo check -p ip-server -p tauri-plugin-imagepicker-media --target aarch64-linux-android
        env:
          CC_aarch64_linux_android: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
      - name: Kotlin unit tests and debug APK
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri android build --debug --apk --target x86_64
          (cd src-tauri/gen/android && ./gradlew :tauri-plugin-imagepicker-media:testDebugUnitTest)
      - uses: actions/upload-artifact@v4
        with:
          name: imagepicker-android-debug-apk
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
