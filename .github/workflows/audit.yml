# Dependency audit: cargo-audit (Cargo.lock), pnpm audit (web/), pip-audit (ai-worker/uv.lock).
#
# This workflow is deliberately separate from ci.yml. Advisories against third-party
# packages change over time and are not caused by the PR under review, so they must not
# block unrelated PRs. It runs weekly, on demand, and on PRs that change a lockfile.
name: Dependency audit

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.lock"
      - "**/pnpm-lock.yaml"
      - "ai-worker/uv.lock"

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  pnpm-audit:
    name: pnpm audit (web)
    runs-on: ubuntu-latest
    continue-on-error: false
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # No dependency cache: `pnpm audit` reads the lockfile and never creates a pnpm store, so the
      # cache's post-job save fails with a path validation error.
      - run: pnpm audit --prod --audit-level high

  pip-audit:
    name: pip-audit (ai-worker)
    runs-on: ubuntu-latest
    continue-on-error: false
    defaults:
      run:
        working-directory: ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      # --no-emit-project keeps the project's own editable line out of the requirements file.
      - run: uv export --frozen --no-hashes --no-emit-project --format requirements-txt > req.txt
      # Audit the pinned versions as written. Without --disable-pip, pip-audit pip-installs the list
      # on this runner's Python and fails on backports pinned only for older Pythons.
      - run: uvx pip-audit --disable-pip --no-deps -r req.txt
