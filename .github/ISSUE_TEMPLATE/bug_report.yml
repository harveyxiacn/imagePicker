name: Bug report / 问题反馈
description: Something does not work as expected
labels: ["type/bug"]
body:
  - type: textarea
    attributes:
      label: What happened / 现象
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce / 复现步骤
  - type: input
    attributes:
      label: Version & OS / 版本与系统
      placeholder: "v0.1.0, Windows 11, RTX 4090"
  - type: textarea
    attributes:
      label: Logs / 日志
      render: text
