[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imagepicker-ai"
version = "0.1.0"
description = "imagePicker AI worker: JSON-RPC 2.0 over WebSocket, local-first photo analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "websockets>=14",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "pillow-heif>=0.18",
    "pyyaml>=6",
    "huggingface_hub>=0.26",
    "tokenizers>=0.20",
    "platformdirs>=4",
    "psutil>=5.9",
    "ai-edge-litert>=2.0",  # NIMA aesthetic / technical IQA (Apache-2.0, tiny)
]

[project.optional-dependencies]
# ONNX Runtime CPU (DirectML / CoreML users: install onnxruntime-directml / onnxruntime-silicon instead).
cpu = ["onnxruntime>=1.20"]
# ONNX Runtime CUDA 13 build (default wheel of onnxruntime-gpu >= 1.30; needs NVIDIA driver >= 580)
# plus the CUDA/cuDNN runtime libs as wheels, so no system CUDA toolkit is needed.
cuda = [
    "onnxruntime-gpu>=1.30",
    "nvidia-cudnn-cu13>=9",
    "nvidia-cublas",
    "nvidia-cuda-runtime",
    "nvidia-cufft",
    "nvidia-curand",
    "nvidia-cuda-nvrtc",
]
# Face blendshapes / head pose. Without it the faces step falls back to YuNet only.
mediapipe = ["mediapipe>=0.10.14"]
# transformers+torch fallback for embeddings (and for exporting ONNX models).
torch = ["torch>=2.4", "transformers>=4.49", "sentencepiece", "protobuf", "onnx"]
# SDXL inpainting (`inpaint.run` with model "sdxl", OpenRAIL++ weights, T3). Install a CUDA build of
# torch yourself if the default wheel is CPU-only; without this extra `sdxl` answers -32010.
pro = ["torch>=2.4", "diffusers>=0.30", "transformers>=4.49", "accelerate>=0.33", "safetensors>=0.4"]

# Local LLM / VLM assistant (`llm.plan`, `vlm.suggest`, `vlm.describe`): onnxruntime-genai, which
# runs int4 ONNX builds of Qwen3 / Phi-3.5-vision with no torch and no compiler. It needs the same
# `onnxruntime` package family as the base install, so pair it like this:
#   uv sync --extra cuda --extra llm-cuda     (NVIDIA; onnxruntime-genai-cuda shares onnxruntime-gpu)
#   uv sync --extra cpu  --extra llm          (CPU / macOS)
llm = ["onnxruntime-genai>=0.17"]
llm-cuda = ["onnxruntime-genai-cuda>=0.17; sys_platform != 'darwin'"]

[project.scripts]
imagepicker-ai = "imagepicker_ai.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
    [{ extra = "cuda" }, { extra = "llm" }],
    [{ extra = "cpu" }, { extra = "llm-cuda" }],
    [{ extra = "llm" }, { extra = "llm-cuda" }],
]
# mediapipe hard-depends on opencv-contrib-python, which would clash with the
# headless wheel we already ship; drop it (mediapipe's Tasks API does not need cv2).
override-dependencies = ["opencv-contrib-python; sys_platform == 'never'"]

[tool.hatch.build.targets.wheel]
packages = ["imagepicker_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC109"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "models: needs model downloads / network (run explicitly: pytest -m models)",
]
addopts = "-m 'not models'"
