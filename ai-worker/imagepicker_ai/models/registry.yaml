# Model registry (schema: docs/07-模型清单与许可.md §1, extended with `files`).
#
# Per entry:
#   id            unique id
#   task          list of tasks the model serves (embed_image, embed_text, face_detect, face_landmarks, ...)
#   source        { hf: <repo>, revision: <opt>, modelscope: <opt>, origin: <upstream repo, informational> }
#   files         [{ path, sha256?, size?, url? }]  files to fetch; `url` (instead of source.hf) for plain HTTP.
#                 The first file is the primary one (what `ModelManager` hands to the loader as `path`).
#   backend       onnx | torch | mediapipe | opencv
#   precision     fp32 | fp16 | int8 (informational)
#   tiers         tiers for which this is a default/recommended model
#   vram_mb/ram_mb/size_mb  budget numbers used by ModelManager
#   license / noncommercial
#   required_for  analyze steps that need this model (informational, surfaced by models.list)
#   resident      keep loaded unless budget forces eviction (analysis models); false = LRU/idle evicted first
#   exclusive_group  at most one loaded model per group (e.g. vlm vs diffusion)
# Weights are never shipped with this repository; they are downloaded on user request.

- id: yunet
  task: [face_detect]
  source: { hf: opencv/face_detection_yunet, modelscope: null }
  files:
