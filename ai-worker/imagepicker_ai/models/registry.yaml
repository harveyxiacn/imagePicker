# NIMA (Neural Image Assessment, Talebi & Milanfar 2018), MobileNet(v1) weights from
# idealo/image-quality-assessment (Apache-2.0), converted to fp16 LiteRT by litert-community.
# Both predict a 10-bin score distribution; score = mean over 1..10.
#   aesthetic: trained on AVA (photographer-rated aesthetics)
#   technical: trained on TID2013 (synthetic blur/noise/compression distortions)
# Licence: the weights/code are Apache-2.0 (idealo/image-quality-assessment, and the litert-community
# re-export). The training datasets (AVA, TID2013) carry research-use terms of their own; they are
# not redistributed here. noncommercial: false reflects the model licence, not the dataset terms
# (flag for the pre-release licence audit, doc 07 section 4).
# Evaluated and rejected as default: pyiqa weights (chaofengc/IQA-PyTorch-Weights, CC-BY-NC-SA-4.0,
# needs torch), somepago/AestheticSigLIP (Apache-2.0 but a 1.7 GB so400m checkpoint, no ONNX).
- id: nima-aesthetic
  task: [aesthetic]
  source: { hf: litert-community/NIMA-LiteRT, origin: idealo/image-quality-assessment }
  files:
    - path: nima_aesthetic_fp16.tflite
      sha256: a5051a0fcced735682735e3e0fd58ee54c83ed664282a003f52235b3dbcb9320
      size: 6448632
  backend: tflite
  precision: fp16
  tiers: [T0, T1, T2, T3]
  vram_mb: 0
  ram_mb: 60
  size_mb: 6.2
  required_for: [aesthetic]
  license: Apache-2.0
  resident: true

- id: nima-technical
  task: [iqa]
  source: { hf: litert-community/NIMA-LiteRT, origin: idealo/image-quality-assessment }
