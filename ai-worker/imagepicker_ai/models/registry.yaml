      sha256: 64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff
      size: 3758596
  backend: mediapipe
  precision: fp16
  tiers: [T0, T1, T2, T3]
  vram_mb: 0
  ram_mb: 150
  size_mb: 3.7
  required_for: [faces]
  license: Apache-2.0
  resident: true

