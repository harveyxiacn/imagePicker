      sha256: 8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4
      size: 232589
  backend: opencv
  precision: fp32
  tiers: [T0, T1, T2, T3]
  vram_mb: 0
  ram_mb: 50
  size_mb: 0.3
  required_for: [faces, identity]
  license: MIT
  resident: true

