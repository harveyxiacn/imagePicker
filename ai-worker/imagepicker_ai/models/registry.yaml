# ---------------------------------------------------------------------------------------------
# AI masks (`mask.generate`, docs/api-contract-m3.md section D, docs/03 section 6.4)
#
# subject / person: BiRefNet (ZhengPeng7/BiRefNet, MIT), community ONNX exports. Output = logits
# of the foreground alpha (sigmoid -> 0..1), input NCHW float32, ImageNet mean/std, squashed to the
# fixed export resolution. `required_for` lists mask targets (not analyze steps).
#   birefnet-lite-512  lite variant exported at 512 px (CPU / T0 default)
#   birefnet-lite      lite variant at 1024 px (T1 CPU)
#   birefnet-lite-fp16 same, fp16 weights (half the download; GPU default)
#   birefnet-fp16      full Swin-L BiRefNet at 1024 px, fp16 weights (optional quality pack, T2+)
# ---------------------------------------------------------------------------------------------
- id: birefnet-lite-512
  task: [segment_subject]
  source: { hf: studioludens/birefnet-lite-512, origin: ZhengPeng7/BiRefNet_lite }
