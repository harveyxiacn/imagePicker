      size: 371807752
    - path: preprocessor_config.json
    - path: config.json
  backend: onnx
  precision: fp32
  tiers: [T0, T1]
  vram_mb: 700
  ram_mb: 900
  size_mb: 355
  license: Apache-2.0
  resident: true

