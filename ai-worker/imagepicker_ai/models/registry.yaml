# AuraFace v1 (fal.ai): ArcFace ResNet-100 trained on commercially usable data. Only the recognition
# net (glintr100.onnx: 112x112 RGB aligned crop, (x-127.5)/127.5 -> 512-d) is used; detection comes
# from YuNet. The other files of the repo (scrfd, 1k3d68, 2d106det, genderage) are not downloaded.
- id: auraface
