# Android cross-compilation (see docs/android-build.md).
#
# The clang/ar names below are resolved through PATH; `source scripts/android-env.sh` (or
# `scripts/cargo-android.sh <cargo args>`) puts the NDK's toolchain on PATH and additionally exports
# CARGO_TARGET_<TRIPLE>_LINKER / CC_<triple> / AR_<triple> with the exact (host-specific) binaries,
# which take precedence over this file. No absolute user paths are committed.
[target.aarch64-linux-android]
linker = "aarch64-linux-android24-clang"
ar = "llvm-ar"

[target.x86_64-linux-android]
linker = "x86_64-linux-android24-clang"
ar = "llvm-ar"

# TEMPORARY (debug branch only, do not merge): serial, uncaptured test output to find a macOS crash.
[env]
RUST_TEST_THREADS = "1"
RUST_TEST_NOCAPTURE = "1"
RUST_BACKTRACE = "1"
