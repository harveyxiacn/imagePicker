[package]
name = "ip-imaging"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
rayon.workspace = true
blake3.workspace = true
jpeg-decoder = { version = "0.3.2", default-features = false }
fast_image_resize = "6.1.0"
memmap2 = "0.9.11"
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
image = { version = "0.25.10", default-features = false, features = ["png", "webp", "tiff", "jpeg"] }
# ICC colour management (pure Rust; already in the tree through `image`).
moxcms = "0.8.1"

# HEIF/AVIF decoders (src/imp/heif.rs): libheif is loaded at runtime, never linked.
[target.'cfg(not(target_os = "android"))'.dependencies]
libloading = "0.8.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com"] }

[dev-dependencies]
tempfile = "3.27.0"
