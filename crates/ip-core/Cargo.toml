[package]
name = "ip-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Exposes `ip_core::testutil` (FakeImaging) to downstream crates' tests.
testutil = []
# On-device YuNet face detection for the lite profile (ONNX Runtime, `ip-infer`); off by default.
infer = ["dep:ip-infer"]

[dependencies]
ip-imaging.workspace = true
ip-lite.workspace = true
ip-worker-client.workspace = true
ip-render.workspace = true
ip-infer = { workspace = true, optional = true }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
rayon.workspace = true
blake3.workspace = true
rusqlite.workspace = true
dirs.workspace = true
image.workspace = true
async-trait.workspace = true
regex.workspace = true
argon2 = "0.6"
getrandom.workspace = true

[dev-dependencies]
tempfile.workspace = true
